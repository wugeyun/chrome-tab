<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新标签页</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>


    <main class="shell">
      <header class="hero">
        <h1 class="clock" id="clock">--:--</h1>
        <form class="search" id="search-form" role="search">
          <div class="search-wrap">
            <button
              type="button"
              class="bookmark-btn"
              id="bookmark-btn"
              aria-label="书签"
              aria-expanded="false"
              aria-controls="bookmark-panel"
              title="书签"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M17 3H7a2 2 0 0 0-2 2v16l7-3 7 3V5a2 2 0 0 0-2-2zm0 15.43-5-2.14-5 2.14V5h10v13.43z"
                />
              </svg>
            </button>
            <input
              type="search"
              id="search-input"
              name="q"
              placeholder="搜索或输入网址"
              autocomplete="off"
              enterkeyhint="search"
              aria-label="搜索"
              aria-autocomplete="list"
              aria-controls="search-suggest"
              aria-expanded="false"
            />
            <button
              type="submit"
              class="search-submit"
              id="search-submit"
              aria-label="搜索"
              title="搜索"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                />
              </svg>
            </button>
            <ul
              class="search-suggest"
              id="search-suggest"
              role="listbox"
              aria-label="搜索建议"
              hidden
            ></ul>
            <div
              class="bookmark-panel"
              id="bookmark-panel"
              role="listbox"
              aria-label="书签"
              hidden
            >
              <div class="bookmark-tree" id="bookmark-tree"></div>
            </div>
          </div>
        </form>
      </header>

      <section class="board" aria-label="卡片">
        <ul class="grid" id="card-grid"></ul>

        <p class="hint" id="empty-hint" hidden>
          还没有卡片。打开任意网页后，点击工具栏扩展图标即可一键添加；也可点「+」手动添加。
        </p>
      </section>

      <footer class="credit" id="credit">武哥出品</footer>
    </main>

    <dialog class="modal" id="edit-dialog">
      <form method="dialog" id="edit-form">
        <h3 id="dialog-title">添加卡片</h3>
        <label>
          名称
          <input type="text" id="field-title" name="title" maxlength="80" required />
        </label>
        <label>
          网址
          <input type="url" id="field-url" name="url" placeholder="https://" required />
        </label>
        <p class="form-error" id="form-error" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="text-danger" id="dialog-delete" hidden>删除</button>
          <div class="dialog-actions-right">
            <button type="button" class="ghost-btn" id="dialog-cancel">取消</button>
            <button type="submit" class="primary-btn" id="dialog-save">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
