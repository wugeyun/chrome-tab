<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="武哥新标签页 · 网页版：固定网页卡片、搜索与导入导出" />
    <title>武哥新标签页</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="newtab.css" />
    <link rel="stylesheet" href="web.css" />
  </head>
  <body class="web-page">
    <div class="atmosphere" aria-hidden="true"></div>

    <button type="button" class="settings-fab" id="settings-btn" aria-label="设置" title="设置">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          fill="currentColor"
          d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.77 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.89 14.52a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.39.3.59.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
        />
      </svg>
    </button>

    <main class="shell">
      <header class="hero">
        <h1 class="clock" id="clock">--:--</h1>
        <form class="search" id="search-form" role="search">
          <div class="search-wrap">
            <input
              type="search"
              id="search-input"
              name="q"
              placeholder="搜索或输入网址"
              autocomplete="off"
              enterkeyhint="search"
              aria-label="搜索"
              aria-autocomplete="list"
              aria-controls="search-suggest"
              aria-expanded="false"
            />
            <button
              type="submit"
              class="search-submit"
              id="search-submit"
              aria-label="搜索"
              title="搜索"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                />
              </svg>
            </button>
            <ul
              class="search-suggest"
              id="search-suggest"
              role="listbox"
              aria-label="搜索建议"
              hidden
            ></ul>
          </div>
        </form>
      </header>

      <section class="board" aria-label="卡片">
        <ul class="grid" id="card-grid"></ul>

        <p class="hint" id="empty-hint" hidden>
          还没有卡片。点「+」手动添加；也可在设置里用分享链接导入。
        </p>
      </section>

      <footer class="credit" id="credit">武哥出品</footer>
    </main>

    <dialog class="modal" id="edit-dialog">
      <form method="dialog" id="edit-form">
        <h3 id="dialog-title">添加卡片</h3>
        <label>
          名称
          <input type="text" id="field-title" name="title" maxlength="80" required />
        </label>
        <label>
          网址
          <input type="url" id="field-url" name="url" placeholder="https://" required />
        </label>
        <p class="form-error" id="form-error" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="text-danger" id="dialog-delete" hidden>删除</button>
          <div class="dialog-actions-right">
            <button type="button" class="ghost-btn" id="dialog-cancel">取消</button>
            <button type="submit" class="primary-btn" id="dialog-save">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog class="modal settings-modal" id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h3>设置</h3>

        <section class="settings-section">
          <h4>外观</h4>
          <div class="theme-modes" role="radiogroup" aria-label="外观模式">
            <label class="theme-option">
              <input type="radio" name="theme" value="light" />
              <span>白天</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="dark" />
              <span>黑夜</span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme" value="auto" checked />
              <span>跟随系统</span>
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h4>导出</h4>
          <p class="settings-desc">生成分享链接，可在扩展或其它设备打开导入。</p>
          <button type="button" class="primary-btn" id="export-btn">生成分享链接</button>
          <div class="share-box" id="share-box" hidden>
            <textarea id="share-url" rows="3" readonly spellcheck="false"></textarea>
            <button type="button" class="ghost-btn" id="copy-btn">复制链接</button>
          </div>
        </section>

        <section class="settings-section">
          <h4>导入</h4>
          <p class="settings-desc">粘贴分享链接；打开带 #wuge= 的链接也会提示导入。</p>
          <div class="import-modes">
            <label class="radio">
              <input type="radio" name="mode" value="merge" checked />
              合并
            </label>
            <label class="radio">
              <input type="radio" name="mode" value="replace" />
              替换
            </label>
          </div>
          <textarea
            id="import-url"
            rows="3"
            spellcheck="false"
            placeholder="粘贴 https://tab.wuge.xyz#wuge=... 链接"
          ></textarea>
          <button type="button" class="primary-btn" id="import-btn">从链接导入</button>
        </section>

        <p class="settings-status" id="settings-status" hidden></p>

        <div class="dialog-actions">
          <div class="dialog-actions-right">
            <button type="submit" class="ghost-btn" id="settings-close" value="close">关闭</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="newtab.js"></script>
    <script type="module" src="web-settings.js"></script>
  </body>
</html>
