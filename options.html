<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>武哥新标签页 · 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <h1>武哥新标签页</h1>
        <p class="lead">用分享链接在电脑之间迁移卡片</p>
      </header>

      <section class="panel">
        <h2>外观</h2>
        <p class="desc">白天模式、黑夜模式，或跟随系统（与浏览器主题一致）。</p>
        <div class="theme-modes" role="radiogroup" aria-label="外观模式">
          <label class="theme-option">
            <input type="radio" name="theme" value="light" />
            <span>白天模式</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="dark" />
            <span>黑夜模式</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="theme" value="auto" checked />
            <span>跟随系统</span>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>当前卡片</h2>
        <p class="meta">共 <strong id="count">0</strong> 张</p>
        <ul class="preview" id="preview"></ul>
      </section>

      <section class="panel">
        <h2>导出</h2>
        <p class="desc">
          生成可复制链接。链接以
          <a href="https://tab.wuge.xyz" target="_blank" rel="noreferrer">tab.wuge.xyz</a>
          为前缀，卡片数据写在地址栏 hash 里。在新设备打开该链接即可导入（扩展或网页版均可）。
        </p>
        <button type="button" class="primary" id="export-btn">生成分享链接</button>
        <div class="share-box" id="share-box" hidden>
          <textarea id="share-url" rows="4" readonly spellcheck="false"></textarea>
          <div class="row">
            <button type="button" class="primary" id="copy-btn">复制链接</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>导入</h2>
        <p class="desc">粘贴导出得到的分享链接，或在新电脑直接打开该链接。</p>
        <div class="import-modes">
          <label class="radio">
            <input type="radio" name="mode" value="merge" checked />
            合并（保留现有，跳过重复网址）
          </label>
          <label class="radio">
            <input type="radio" name="mode" value="replace" />
            替换（清空现有，以链接为准）
          </label>
        </div>
        <textarea
          id="import-url"
          rows="3"
          spellcheck="false"
          placeholder="粘贴 https://tab.wuge.xyz#wuge=... 链接"
        ></textarea>
        <div class="row">
          <button type="button" class="primary" id="import-btn">从链接导入</button>
        </div>
      </section>

      <p class="status" id="status" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
