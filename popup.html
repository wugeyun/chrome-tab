<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>添加当前页面</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>一键添加</h1>
      <p class="lead">把当前打开的页面固定到新标签页</p>

      <label>
        名称
        <input type="text" id="title" maxlength="80" />
      </label>
      <label>
        网址
        <input type="url" id="url" readonly />
      </label>

      <p class="status" id="status" hidden></p>

      <div class="actions">
        <button type="button" class="secondary" id="open-newtab">打开新标签页</button>
        <button type="button" class="primary" id="add">添加</button>
      </div>
      <button type="button" class="linkish" id="open-options">打开设置</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
